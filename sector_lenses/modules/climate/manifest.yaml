id: climate
name: Climate-FCV Lens
version: 1.1.0
description: Screens material climate risks, project effects, credible climate co-benefits, and peace and social dividend pathways through an FCV lens.
status: enabled
activation: manual
aliases: [climate, climate change]
compatibility:
  compatible_with: ["*"]
  incompatible_with: []
readout_sections:
  - id: invest-in
    title: Where the project could build climate, peace, and social dividends
    item_ids:
      - social-cohesion-inclusion
      - institutional-capacity-legitimacy
      - livelihoods-opportunity
  - id: deliver-through
    title: How project design and delivery could strengthen those dividends
    item_ids:
      - context-analysis-monitoring
      - trust-collaboration
      - flexible-adaptive-delivery
budgets:
  stage1: 550
  stage2: 1850
  stage3: 180
stage_instructions:
  stage1: Collect only evidence needed to establish High, Medium, or Low Climate-FCV materiality, two-way causal pathways, affected groups, delivery constraints, and plausible dividend entry points. Do not diagnose or recommend.
  stage2: Assign proportionate materiality. For both interaction directions provide stable pathway_id values and specific causal chains from pressure through mechanism to project implication and design response. Name project elements, locations or groups, evidence, uncertainty, and current-near-term, project-lifetime, or asset-system-lifetime horizons. Keep selective dividend pathways distinct and suppress generic claims.
  stage3: Preserve the full core FCV executive summary and integrate Climate-FCV interactions, selective dividends, and only material actionable findings into one common priority list. Avoid generic Climate advice and treat category balance as flexible rather than quota-driven.
