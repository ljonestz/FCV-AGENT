- id: mc-07
  mechanism: Insecurity access constraints, site readiness, and adaptive phasing/supervision
  routes:
  - sector
  - feature
  sectors:
  - ews_hydromet
  - transport
  features:
  - rural_feeder_roads
  - ews_hydromet
  sr_type: S
  core_mappings:
  - dnh:6
  - ost:4
  - ost:5
  - ost:6
  - ost:10
  - shift:A
  - shift:B
  applicability: Multi-site physical works or observation networks in active-conflict or volatile-access zones (IPF/PforR;
    appraisal/implementation/restructuring).
  sufficient_evidence: Document builds/rehabilitates field assets or hydromet stations across areas with documented
    insecurity, access restrictions, or volatile control.
  look_for: 'Transport: segment-level access/security screening, remote/TPM engineering supervision, and pre-agreed
    rules to swap/re-phase segments without reopening allocation disputes. DRM/EWS: matching EWS ambition to conflict
    tier (minimum viable network vs new stations), verified site readiness (access, custodian, O&M), and indicators
    verifiable if access collapses.'
  prompt_text: Assess whether the document matches physical investment scope to documented security and access constraints,
    sets pre-agreed readiness and re-phasing rules, and ensures supervision and results indicators remain viable
    if field access deteriorates.
  sources:
  - citation: 'Violent Conflict and the Road Sector: Points of Interaction (Rebosio & Wam, World Bank 2011) (p.17
      insecure areas; p.33 security personnel perceived as partisan)'
    kind: wbg_public
    cite_to_user: true
  - citation: EWS White Paper (2024, p.23-24)
    kind: wbg_public
    cite_to_user: true
  - citation: DRM in FCV FY12-22 (2023, p.23)
    kind: wbg_public
    cite_to_user: true
  - citation: Myanmar Nexus Diagnostic (2026, p.27)
    kind: wbg_public
    cite_to_user: true
