    kind: wbg_public
    cite_to_user: true
  - citation: Defueling Conflict (2022, p.42, p.54)
    kind: wbg_public
    cite_to_user: true
  - citation: Future of Food (2021, p.36)
    kind: wbg_public
    cite_to_user: true
  - citation: NRM CCDR Note (2024, p.20, p.23)
    kind: wbg_public
    cite_to_user: true
  member_questions:
  - TRN-03
  - AGR-04
  - CLI-01
  - CLI-02
  - DRM-09
  evidence_note: 'False'
- id: mc-03
  mechanism: Capture and exclusion in local resource/user committees and dispute bodies
  routes:
  - sector
  - feature
  sectors:
  - agriculture
  - enrm
  - water
  features:
  - local_funds_cdd
  - water_points_wash
  - nrm_landscape_forest
  sr_type: S+R
  core_mappings:
  - dnh:2
  - dnh:5
  - dnh:8
  - ost:2
  - ost:3
  applicability: Operations creating, strengthening, or handing assets/funds to WUAs, water committees, landscape/pasture
    boards, or commune planning committees (IPF/PforR; appraisal/implementation).
  sufficient_evidence: Document establishes or relies on local user/governance committees or participatory resource
    management AND notes exclusion, elite capture, or local resource-dispute risks.
  look_for: 'Water: WUA/water-committee composition, internal audit/dispute roles, and user-fee fairness. Agri/ENRM:
    representation of women, pastoralists, migrants, and secondary users on landscape/pasture committees; clear
    customary-vs-state referral rules; shared-resource agreements as cooperation entry points.'
  prompt_text: Assess whether the document defines transparent membership, inclusion of marginalized or secondary
    users, internal accountability, and customary-state dispute referral for local resource or user committees.
  sources:
