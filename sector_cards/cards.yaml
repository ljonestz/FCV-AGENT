cards:
- id: mc-01
  mechanism: Siting and geographic alignment across divided communities or jurisdictions
  routes:
  - sector
  - feature
  sectors:
  - agriculture
  - enrm
  - transport
  - water
  features:
  - rural_feeder_roads
  - water_points_wash
  - nrm_landscape_forest
  sr_type: S
  core_mappings:
  - dnh:1
  - dnh:3
  - dnh:4
  - ost:2
  applicability: New/upgraded roads, water points, irrigation, markets, or protective works across divided jurisdictions
    or resource co-users (IPF/PforR; concept/appraisal).
  sufficient_evidence: Document names multiple candidate locations/corridors or shared-resource siting AND establishes
    subnational, group, or urban-rural allocation divides.
  look_for: 'Transport: stated technical vs political segment-selection criteria and boundary consultations. Water:
    baseline mapping of water points/standposts and equity testing across host/displaced or rival wards. Agri/ENRM:
    consultation of unserved neighbouring/transit co-users and risk-transfer checks on protective works.'
  prompt_text: Assess whether the document explains how physical assets, segments, or protective works are sited
    across communities and jurisdictions using transparent criteria, and whether it accounts for non-beneficiary
    co-users or perceptions of favouritism.
  sources:
  - citation: 'Violent Conflict and the Road Sector: Points of Interaction (Rebosio & Wam, World Bank 2011) (p.17
      covering insecure areas; p.19 road selection and distributional impacts)'
    kind: wbg_public
    cite_to_user: true
  - citation: Turbulent Waters (2017, p.29-30)
    kind: wbg_public
    cite_to_user: true
  - citation: Water Supply Transition (2017, p.20)
    kind: wbg_public
    cite_to_user: true
  - citation: Defueling Conflict (2022, p.42)
    kind: wbg_public
    cite_to_user: true
  member_questions:
  - TRN-01
  - TRN-02
  - WAT-01
  - AGR-11
  - CLI-04
  evidence_note: 'False'
- id: mc-02
  mechanism: Land acquisition, customary/secondary tenure loss, and value-uplift disputes
  routes:
  - sector
  - feature
  - dpf_prior_action
  sectors:
  - agriculture
  - enrm
  - ews_hydromet
  - transport
  features:
  - land_acquisition_tenure
  - rural_feeder_roads
  - nrm_landscape_forest
  - pa_land_tenure_reform
  sr_type: S
  core_mappings:
  - dnh:1
  - dnh:2
  - dnh:3
  - dnh:5
  - dnh:7
  applicability: 'Civil works land take, land registration/titling, restoration/PES, or post-disaster reconstruction
    in areas with contested, informal, or customary tenure (IPF/PforR/DPF; concept/appraisal). | DPF: prior actions
    on land registration, titling, expropriation or concession law.'
  sufficient_evidence: Document involves land acquisition (ESS5/RAP), tenure/concession reform, restoration/PES,
    or housing relocation AND notes contested/customary tenure, displacement, or resettlement capacity risks.
  look_for: 'Transport: corridor land-value inflation, unregistered/displaced-owner land, and RAP preparation timelines.
    Agri/ENRM: customary, seasonal, or common-use grazing rights extinguished by titling, concessions, restoration,
    or PES value uplift. DRM: post-disaster housing/relocation land disputes and secondary displacement.'
  prompt_text: Assess whether the document identifies and manages risks that land acquisition, tenure formalization,
    resource value uplift, or relocation could extinguish customary or displaced-owner rights or trigger land disputes.
  sources:
  - citation: 'Violent Conflict and the Road Sector: Points of Interaction (Rebosio & Wam, World Bank 2011) (p.24
      land acquisition and natural resources)'
    kind: wbg_public
    cite_to_user: true
