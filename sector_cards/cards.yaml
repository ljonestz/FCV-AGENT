  - DRM-08
  evidence_note: 'False'
- id: mc-09
  mechanism: Civil-works 'local' labor delineation and contractor patronage alignment
  routes:
  - sector
  - feature
  sectors:
  - transport
  features:
  - rural_feeder_roads
  sr_type: S+R
  core_mappings:
  - dnh:1
  - dnh:2
  - dnh:5
  - shift:C
  applicability: Large or labor-intensive linear civil works spanning multiple communities in divided or high-patronage
    settings (IPF/PforR; appraisal/implementation).
  sufficient_evidence: Document finances major civil works with local employment/worker camps AND notes labor-influx,
    SEA/SH, procurement-integrity, or inter-community hiring risks.
  look_for: Clear definition of 'local' hiring along multi-community corridors, fair allocation across host/displaced/women
    workers, labor-influx/SEA-SH monitoring, and contractor/subcontractor market checks against patronage concentration.
  prompt_text: Assess whether the document defines local recruitment boundaries across corridor communities, monitors
    fair job allocation and labor-influx/SEA-SH risks, and mitigates patronage concentration in civil-works contracting
    and subcontracting.
  sources:
  - citation: 'Violent Conflict and the Road Sector: Points of Interaction (Rebosio & Wam, World Bank 2011) (p.22-23
      local employment and construction method; p.30 contractor procurement risk)'
    kind: wbg_public
    cite_to_user: true
  member_questions:
  - TRN-04
  - TRN-05
  evidence_note: 'False'
- id: mc-10
  mechanism: Build-neglect-rebuild political bias in transport asset maintenance
  routes:
  - sector
  - feature
  sectors:
  - transport
  features:
  - rural_feeder_roads
  sr_type: R
  core_mappings:
  - ost:3
  - ost:4
  applicability: New or rehabilitated road networks where maintenance funding is weak or vulnerable to political-cycle
    neglect (IPF/PforR; appraisal/implementation).
  sufficient_evidence: Document finances road construction/rehabilitation AND flags weak road-maintenance funding,
    fiscal stress, or political-cycle continuity risks.
  look_for: Ring-fenced maintenance budgets, multi-year performance-based road maintenance contracts (PBCs), microenterprise
    upkeep, and institutional continuity across elections.
  prompt_text: Assess whether the document addresses the risk that political or fiscal pressures favour new road
    construction over maintenance, through ring-fenced upkeep financing, multi-year maintenance contracts, or local
    maintenance arrangements.
  sources:
  - citation: 'Violent Conflict and the Road Sector: Points of Interaction (Rebosio & Wam, World Bank 2011) (p.29
      community road maintenance, Burundi; p.31 local maintenance participation)'
    kind: wbg_public
    cite_to_user: true
  member_questions:
  - TRN-08
  evidence_note: 'No (public WBG source added: Rebosio & Wam 2011, p.29, p.31)'
- id: mc-12
  mechanism: 'Allocation of shared water: downstream users, transboundary basins and groundwater capture'
  routes:
  - sector
  - feature
  sectors:
  - water
  features:
  - water_points_wash
  - bulk_water_irrigation
  - agri_inputs_pastoral
  sr_type: S
  core_mappings:
  - dnh:2
  - dnh:3
  - ost:1
  - ost:4
  - shift:A
  applicability: Bulk abstraction, dams, reservoirs, canals, or groundwater works on shared basins or international
    waterways (IPF/DPF; concept/appraisal).
  sufficient_evidence: Document increases water abstraction/storage or touches a shared river/aquifer AND identifies
    downstream users, seasonal scarcity, or international riparian states.
  look_for: Upstream-downstream user mapping (e.g. urban intake vs downstream farmers), seasonal shortage rules,
    shared hydrological data, basin committees, riparian notification on international waterways; distribution of
    well and pump ownership, abstraction licensing and aquifer monitoring where pumping or irrigation is subsidised.
  prompt_text: Consider whether the document assesses how new abstraction, storage, pumping or irrigation changes
    water available to downstream, neighbouring or smaller users, and whether allocation rules, shared data, licensing
    and consultation arrangements are in place.
  sources:
  - citation: Turbulent Waters (2017, p.35, p.49, p.51-52, p.55)
    kind: wbg_public
    cite_to_user: true
  - citation: Water Management MENA (2018, p.41-42)
    kind: wbg_public
    cite_to_user: true
  - citation: Yemen Water Diagnostic (2023, p.14)
    kind: wbg_public
    cite_to_user: true
  member_questions:
  - WAT-03
  - WAT-04
  - WAT-12
  evidence_note: 'False'
- id: mc-13
  mechanism: Water tariff hikes, prepaid metering, and disconnection affordability shock
  routes:
  - sector
  - feature
  - dpf_prior_action
  sectors:
  - water
  features:
  - water_points_wash
  - pa_tariff_subsidy_reform
  sr_type: S+R
  core_mappings:
  - dnh:3
  - dnh:7
  - ost:4
  applicability: 'Water/sanitation projects introducing or raising tariffs, metering, collection enforcement, or
    subsidy reform in fragile or tense urban contexts (IPF/PforR/DPF; appraisal/implementation). | DPF: prior actions
    raise utility tariffs, cut subsidies or introduce metering or cost recovery.'
  sufficient_evidence: Document includes tariff adjustments, PBCs on tariff reform, prepaid metering, or NRW billing
    enforcement AND notes affordability burdens, political fragility, or social resistance risks.
  look_for: Lifeline/social tariff blocks, phased cost-recovery sequencing relative to economic/political fragility,
    prepaid-meter vandalism or rejection risks, and affordability compared with informal tanker water.
  prompt_text: Assess whether the document evaluates how tariff increases, prepaid metering, or billing enforcement
    affect low-income, displaced, or tense urban households, and whether lifeline protections and communication
    are phased appropriately.
  sources:
  - citation: Water Supply Transition (2017, p.10-11)
    kind: wbg_public
    cite_to_user: true
  - citation: Turbulent Waters (2017, p.50)
    kind: wbg_public
    cite_to_user: true
  - citation: NRM CCDR Note (2024, p.23)
    kind: wbg_public
    cite_to_user: true
  member_questions:
  - WAT-05
  evidence_note: 'False'
- id: mc-16
  mechanism: Pastoral mobility, seasonal access and post-conflict restocking
  routes:
  - sector
  - feature
  sectors:
  - agriculture
  features:
  - agri_inputs_pastoral
  - nrm_landscape_forest
  sr_type: S+R
  core_mappings:
  - dnh:3
  - dnh:4
  - ost:1
  applicability: Agriculture, landscape, rangeland, water, or rural-infrastructure projects in regions with seasonal
    transhumance or mobile pastoralism (IPF/PforR; concept/appraisal).
  sufficient_evidence: Document operates in pastoral/agro-pastoral zones (e.g., Sahel, Horn, Lake Chad) AND modifies
    land use, landscapes, water points, or rural infrastructure.
  look_for: Mapping of transhumance corridors and dry-season water and grazing access; easements before fencing
    or zoning; consultation with mobile and transit herders; where restocking is financed, raiding risk and renegotiated
    grazing and water agreements with hosts.
  prompt_text: Consider whether the document identifies seasonal transhumance corridors and dry-season water and
    grazing access in the project area, shows how siting and land-use planning keep them open, and, where herds
    are restocked, how raiding risk and grazing agreements are handled.
  sources:
  - citation: Pastoralism in the Sahel (2016, p.35, p.42-43)
    kind: wbg_public
    cite_to_user: true
  - citation: Land & Conflict Note 03 (2018, p.20-21)
    kind: wbg_public
    cite_to_user: true
  member_questions:
  - AGR-01
  - AGR-09
  evidence_note: 'False'
- id: mc-17
  mechanism: Targeting capture and diversion of subsidized agricultural inputs, matching grants, or food reserves
  routes:
  - sector
  - feature
  sectors:
  - agriculture
  features:
  - agri_inputs_pastoral
  - local_funds_cdd
  sr_type: S
  core_mappings:
  - dnh:1
  - dnh:4
  - dnh:5
  applicability: Operations distributing seeds, fertilizer, matching grants, productive-alliance subsidies, vouchers,
    or food-reserve releases in divided or fragile contexts (IPF/PforR/DPF; appraisal/implementation).
  sufficient_evidence: Document finances matching grants, input subsidies, vouchers, or food reserves AND operates
    in regions with documented exclusion, governance weakness, or subnational conflict.
  look_for: Transparent eligibility validation across identity/regional lines, digital/e-voucher leakage controls,
