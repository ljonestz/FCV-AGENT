- id: mc-04
  mechanism: Control, taxation or extortion of routes, markets, works sites and resource chains
  routes:
  - sector
  - feature
  sectors:
  - agriculture
  - enrm
  - transport
  features:
  - rural_feeder_roads
  - civil_works_contracts
  - agri_inputs_pastoral
  - nrm_landscape_forest
  sr_type: S
  core_mappings:
  - dnh:2
  - dnh:6
  - dnh:7
  - ost:1
  - shift:C
  applicability: Corridors, border crossings, markets, large civil-works contracts or resource value chains, ONLY
    where the document records illicit activity, extortion, checkpoints or non-state territorial control (IPF/PforR;
    concept to implementation).
  sufficient_evidence: The document itself cites illicit activity, extortion, checkpoints/informal taxation, smuggling
    or territorial control by non-state or criminal actors in the project area.
  look_for: 'Transport: checkpoints, informal taxation and armed or criminal control of corridors; extortion of
    contractors and works sites; border crossings and enclaves (cross-border look-for rests on internal sources
    only). Agriculture: informal taxation along market and livestock routes; value-chain intermediaries. ENRM: illegal
    logging, charcoal, poaching or artisanal mining economies where documented.'
  prompt_text: Where the document identifies illicit economies, extortion, checkpoints or contested territorial
    control in project areas, consider whether it examines how improved routes, markets, works sites or resource
    chains could be captured, taxed or diverted, and what procurement, security and incident-reporting arrangements
    apply.
  sources:
  - citation: Road Investment and Violence in DRC (World Bank working paper) (p.8 checkpoints; p.30 armed-group
      taxation of traffic)
    kind: wbg_public
    cite_to_user: true
  - citation: 'Violent Conflict and the Road Sector: Points of Interaction (Rebosio & Wam, World Bank 2011) (p.30
      procurement risk to contractors; p.32 roads used by state and armed groups)'
    kind: wbg_public
    cite_to_user: true
  - citation: Pastoralism in the Sahel (2016, p.34-35)
    kind: wbg_public
    cite_to_user: true
  - citation: NRM CCDR Note (2024, p.25)
    kind: wbg_public
    cite_to_user: true
  - citation: 'Jobs Notes 11 (2020, p.2: businesses face extortion)'
    kind: wbg_public
    cite_to_user: true
  - citation: 'FIU Gordon Institute, Extortion: The Backbone of Criminal Activity in Latin America (c.2020), p.6,
      p.14 (extortion highest in construction, Peru survey)'
    kind: external_public
    cite_to_user: true
  - citation: DFID, Supporting Infrastructure Development in FCAS (c.2016), p.34 (illegal-payments declaration at
      contract award)
    kind: external_public
    cite_to_user: true
  - citation: UNOPS, Infrastructure for Peacebuilding (c.2017), p.16 (assets used for extortion, roadblocks)
    kind: external_public
    cite_to_user: true
  member_questions:
  - TRN-07
  - AGR-06
  - AGR-07
  - CLI-07
  - GAP-EXTORTION
  - TRN-10
  evidence_note: 'Still partly thin: no UN or IFI source on contractor extortion in Central America was found.'
- id: mc-05
  mechanism: Displaced-host pressure on services and prices, including informal providers
  routes:
  - sector
  - feature
  sectors:
  - ews_hydromet
  - transport
  - water
  features:
  - water_points_wash
  - rural_feeder_roads
  - ews_hydromet
  sr_type: S+R
  core_mappings:
  - dnh:1
  - dnh:3
  - dnh:4
  - ost:2
  - shift:B
  applicability: Projects operating in areas hosting refugees, IDPs, or returnees alongside host communities (IPF/PforR;
    concept/appraisal/implementation).
  sufficient_evidence: Document explicitly notes IDPs, refugees, returnees, or camps in the project footprint AND
    links project services/assets to host-displaced demand or access gaps.
  look_for: 'Water: demand surges in host areas, tanker and vendor price spikes, perceived permanence of camp boreholes,
    equal standards, and transition plans for informal tankers or vendors. Transport: physical isolation of camps
    and informal settlements. EWS: warning channels and realistic shelter advice for displaced people.'
  prompt_text: Consider whether the document accounts for displaced people's demand and mobility alongside host
    communities, including risks of price rises, uneven standards, resistance from informal providers, or protective
    advice that does not reach them.
  sources:
  - citation: Turbulent Waters (2017, p.29)
    kind: wbg_public
    cite_to_user: true
  - citation: Water Management MENA (2018, p.36-37)
    kind: wbg_public
    cite_to_user: true
  - citation: Yemen Water Diagnostic (2023, p.20)
    kind: wbg_public
    cite_to_user: true
  - citation: EWS White Paper (2024, p.24, p.40)
    kind: wbg_public
    cite_to_user: true
  - citation: Myanmar Nexus Diagnostic (2026, p.28)
    kind: wbg_public
    cite_to_user: true
  member_questions:
  - TRN-09
  - WAT-09
  - DRM-02
  - GAP-TANKER-VENDORS
  evidence_note: 'False'
- id: mc-06
  mechanism: Parallel humanitarian/non-state delivery, handover, and contested authority legitimacy
  routes:
  - sector
  - feature
  sectors:
  - ews_hydromet
  - water
  features:
  - water_points_wash
  - ews_hydromet
  - local_funds_cdd
  sr_type: S+R
  core_mappings:
  - ost:2
  - ost:9
  - ost:10
  - dnh:2
  - dnh:5
  - shift:B
  - shift:D
  applicability: Protracted-crisis, post-conflict, or contested-authority settings where UN, NGO, community, or
    non-state actors deliver services or preparedness (IPF/PforR; concept/appraisal/implementation).
  sufficient_evidence: Document uses UN/NGO/TPI or non-state delivery channels OR operates where public authority
    is contested, transitional, or absent in parts of the project footprint.
  look_for: 'Water: inventory of NGO/UN/informal providers, O&M handover to public oversight, credit attribution,
    and de facto authority control maps. DRM/EWS: pre-agreed UN/NGO delivery channels for unreachable zones, partner
    accountability screening, and avoiding erosion of state capacity or undue legitimation.'
  prompt_text: Assess whether the document clarifies coordination, accountability, visibility, and eventual handover
    between public institutions and humanitarian, community, or non-state delivery partners without entrenching
    parallel systems or heightening legitimacy risks.
  sources:
