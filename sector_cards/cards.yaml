- id: mc-08
  mechanism: Targeting, sabotage, or dual-use visibility risk to sector assets and responders
  routes:
  - sector
  - feature
  sectors:
  - ews_hydromet
  - water
  features:
  - water_points_wash
  - ews_hydromet
  sr_type: S+R
  core_mappings:
  - dnh:6
  - dnh:4
  - ost:4
  - shift:A
  applicability: Bulk water/pumping assets, civil protection, shelters, or alerting hardware in active-conflict
    or contested areas (IPF/PforR; concept/appraisal).
  sufficient_evidence: Document finances bulk water/power-dependent assets, civil protection, or alerting hardware
    in areas with documented active violence or contesting armed actors.
  look_for: 'Water: vulnerability of dams, pumping stations, treatment plants, and power/fuel supply to damage or
    shutoff; decentralized redundancy and neutral operation. DRM/EWS: avoiding visible sirens/towers or uniforms
    mistaken for security forces; discreet, non-dual-use response kits with clear custodianship.'
  prompt_text: Where the document indicates active insecurity in the project footprint, assess whether it evaluates
    risks that water, power, or civil-protection assets could be targeted, diverted, or mistaken for security infrastructure,
    and whether siting, visibility, or redundancy measures address this.
  sources:
  - citation: 'Violent Conflict and the Road Sector: Points of Interaction (Rebosio & Wam, World Bank 2011) (p.32
      roads used by government forces and armed groups)'
    kind: wbg_public
    cite_to_user: true
  - citation: Water Management MENA (2018, p.37-39)
    kind: wbg_public
    cite_to_user: true
  - citation: Yemen Water Diagnostic (2023, p.14, p.20)
    kind: wbg_public
    cite_to_user: true
  - citation: EWS White Paper (2024, p.46)
    kind: wbg_public
    cite_to_user: true
